<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sertifikat Capstone Project Bisnis Digital</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--g:#059669;--bg:#f8fafc;--tx:#0f172a;--card:#fff;--bd:#e2e8f0}
@media(prefers-color-scheme:dark){:root{--bg:#0f172a;--tx:#f1f5f9;--card:#1e293b;--bd:#334155}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,Arial,sans-serif;background:var(--bg);color:var(--tx);display:flex;justify-content:center;padding:20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:22px;width:100%;max-width:460px}
h1{font-size:1.15rem;margin:0 0 4px;color:var(--g)}p{margin:0 0 12px;font-size:.85rem;opacity:.8}
label{display:block;font-size:.8rem;font-weight:600;margin:12px 0 4px}
input{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
button{width:100%;margin-top:16px;background:var(--g);color:#fff;border:0;padding:12px;border-radius:8px;font-weight:700;cursor:pointer;font-size:1rem}
button:disabled{opacity:.6;cursor:wait}
#msg{margin-top:12px;font-size:.9rem}.ok{color:var(--g)}.err{color:#dc2626}
canvas{display:none}
</style>
</head>
<body>
<div class="card">
<h1>Sertifikat Capstone Project 2026/2027</h1>
<p>Isi data di bawah. Sertifikat (PDF) akan dikirim otomatis ke email Anda.</p>
<form id="f">
<label>Nama Lengkap</label><input id="nama" required maxlength="80">
<label>Jurusan / Program Studi</label><input id="jurusan" required maxlength="80" value="Bisnis Digital">
<label>Email</label><input id="email" type="email" required maxlength="120">
<label id="kodeLbl" style="display:none">Kode Akses (dari panitia)</label><input id="kode" style="display:none" maxlength="40">
<button id="btn" type="submit">Kirim Sertifikat</button>
</form>
<div id="msg"></div>
</div>
<canvas id="cv" width="1754" height="1240"></canvas>
<script>
/* ===== PENGATURAN ===== */
const CFG={
  template:"template.png",       // taruh gambar format sertifikat Anda di folder yang sama (A4 landscape). Jika tidak ada, desain bawaan dipakai.
  namaY:580, jurusanY:660,        // posisi teks (px, kanvas 1754x1240) bila memakai template sendiri
  judul:"Capstone Project 2026/2027 \u201CMega Aksi Video Promosi Viral untuk 46 UMKM Lokal Bukittinggi\u201D",
  tgl:"Bukittinggi, Desember 2026",
  ketua:"Nama Ketua Prodi",
  jabatan:"Ketua Program Studi Bisnis Digital",
  kodeAkses:false                 // ubah true jika di Vercel Anda mengisi KODE_AKSES
};
/* ====================== */
const $=id=>document.getElementById(id);
const cv=$("cv"),ctx=cv.getContext("2d"),W=1754,H=1240;
if(CFG.kodeAkses){$("kode").style.display=$("kodeLbl").style.display="block"}

function wrap(t,x,y,maxW,lh){
  let line="";
  for(const w of t.split(" ")){
    const test=line+w+" ";
    if(ctx.measureText(test).width>maxW&&line){ctx.fillText(line.trim(),x,y);line=w+" ";y+=lh}else line=test;
  }
  ctx.fillText(line.trim(),x,y);
}
function loadTpl(){
  return new Promise(res=>{
    const im=new Image();
    im.onload=()=>res(im);im.onerror=()=>res(null);im.src=CFG.template;
  });
}
async function draw(nama,jurusan){
  const tpl=await loadTpl();
  ctx.clearRect(0,0,W,H);ctx.fillStyle="#fff";ctx.fillRect(0,0,W,H);
  ctx.textAlign="center";ctx.fillStyle="#0f172a";
  if(tpl){
    ctx.drawImage(tpl,0,0,W,H);
    let fs=84;ctx.font=`bold ${fs}px Georgia,serif`;
    while(ctx.measureText(nama).width>1300&&fs>40){fs-=4;ctx.font=`bold ${fs}px Georgia,serif`}
    ctx.fillText(nama,W/2,CFG.namaY);
    ctx.font="34px Georgia,serif";ctx.fillText("Program Studi "+jurusan,W/2,CFG.jurusanY);
    return;
  }
  ctx.strokeStyle="#059669";ctx.lineWidth=18;ctx.strokeRect(40,40,W-80,H-80);
  ctx.strokeStyle="#d4a72c";ctx.lineWidth=4;ctx.strokeRect(75,75,W-150,H-150);
  ctx.font="600 30px Georgia,serif";ctx.fillText("PROGRAM STUDI BISNIS DIGITAL",W/2,170);
  ctx.font="26px Georgia,serif";ctx.fillText("UIN Sjech M. Djamil Djambek Bukittinggi",W/2,210);
  ctx.fillStyle="#059669";ctx.font="bold 110px Georgia,serif";ctx.fillText("SERTIFIKAT",W/2,350);
  ctx.fillStyle="#0f172a";ctx.font="italic 30px Georgia,serif";ctx.fillText("Diberikan kepada:",W/2,450);
  let fs=84;ctx.font=`bold ${fs}px Georgia,serif`;
  while(ctx.measureText(nama).width>1300&&fs>40){fs-=4;ctx.font=`bold ${fs}px Georgia,serif`}
  ctx.fillText(nama,W/2,560);
  ctx.strokeStyle="#d4a72c";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(400,590);ctx.lineTo(W-400,590);ctx.stroke();
  ctx.font="30px Georgia,serif";ctx.fillStyle="#0f172a";ctx.fillText("Program Studi "+jurusan,W/2,640);
  ctx.font="32px Georgia,serif";
  wrap("atas partisipasinya dalam "+CFG.judul+", dengan tagar #bduinsmdd2025.",W/2,730,1250,50);
  ctx.font="28px Georgia,serif";ctx.fillText(CFG.tgl,W/2+330,980);ctx.fillText("Ketua Program Studi,",W/2+330,1020);
  ctx.font="bold 30px Georgia,serif";ctx.fillText(CFG.ketua,W/2+330,1130);
  ctx.beginPath();ctx.strokeStyle="#0f172a";ctx.lineWidth=2;ctx.moveTo(W/2+130,1100);ctx.lineTo(W/2+530,1100);ctx.stroke();
  ctx.font="22px Georgia,serif";ctx.fillText(CFG.jabatan,W/2+330,1165);
}
function toPdfBase64(){
  const {jsPDF}=window.jspdf;
  const pdf=new jsPDF({orientation:"landscape",unit:"mm",format:"a4"});
  pdf.addImage(cv.toDataURL("image/jpeg",.9),"JPEG",0,0,297,210);
  return pdf.output("datauristring").split(",")[1];
}
$("f").addEventListener("submit",async e=>{
  e.preventDefault();
  const btn=$("btn"),msg=$("msg");
  const nama=$("nama").value.trim(),jurusan=$("jurusan").value.trim(),email=$("email").value.trim();
  btn.disabled=true;msg.className="";msg.textContent="Membuat dan mengirim sertifikat...";
  try{
    await draw(nama,jurusan);
    const r=await fetch("/api/kirim",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({nama,jurusan,email,kode:$("kode").value,pdf:toPdfBase64()})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(d.error||"Gagal mengirim.");
    msg.className="ok";msg.textContent="Berhasil! Cek inbox (atau folder spam) di "+email+".";
    $("f").reset();$("jurusan").value="Bisnis Digital";
  }catch(err){msg.className="err";msg.textContent=err.message}
  btn.disabled=false;
});
</script>
</body>
</html>
